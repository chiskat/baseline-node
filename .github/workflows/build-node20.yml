          pnpm install --frozen-lockfile
          pnpm exec tsx "$REPO_ROOT/20/baseline-node20-puppeteer/build.ts"

  build-node20-full-puppeteer:
    name: baseline-node20-full-puppeteer
    needs: build-node20-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
