name: Build Node 20 Images

on:
  workflow_call:

jobs:
  build-node20:
    name: baseline-node20 (slim)
    uses: ./.github/workflows/build-image.yml
    with:
      image_name: baseline-node20 (slim)
      build_script: 20/baseline-node20/build.sh
    secrets: inherit

  build-node20-alpine:
    name: baseline-node20-alpine
    uses: ./.github/workflows/build-image.yml
    with:
      image_name: baseline-node20-alpine
      build_script: 20/baseline-node20-alpine/build.sh
    secrets: inherit

  build-node20-full:
    name: baseline-node20-full
    uses: ./.github/workflows/build-image.yml
    with:
      image_name: baseline-node20-full
      build_script: 20/baseline-node20-full/build.sh
    secrets: inherit

  build-node20-puppeteer:
    name: baseline-node20-puppeteer
    needs: build-node20
    uses: ./.github/workflows/build-image.yml
    with:
      image_name: baseline-node20-puppeteer
      build_script: 20/baseline-node20-puppeteer/build.sh
    secrets: inherit

  build-node20-full-puppeteer:
    name: baseline-node20-full-puppeteer
    needs: build-node20-full
    uses: ./.github/workflows/build-image.yml
    with:
      image_name: baseline-node20-full-puppeteer
      build_script: 20/baseline-node20-full-puppeteer/build.sh
    secrets: inherit
