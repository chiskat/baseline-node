name: Build Node 24 Images

on:
  push:
    branches:
      - main

jobs:
  build-node24:
    name: baseline-node24 (slim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: chiskat
          password: ${{ secrets.DOCKER_PASS }}

      - name: 构建并推送
        env:
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
          REPO_ROOT: ${{ github.workspace }}
        run: bash "$REPO_ROOT/24/baseline-node24/build.sh"

  build-node24-alpine:
    name: baseline-node24-alpine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: chiskat
          password: ${{ secrets.DOCKER_PASS }}

      - name: 构建并推送
        env:
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
          REPO_ROOT: ${{ github.workspace }}
        run: bash "$REPO_ROOT/24/baseline-node24-alpine/build.sh"

  build-node24-full:
    name: baseline-node24-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: chiskat
          password: ${{ secrets.DOCKER_PASS }}

      - name: 构建并推送
        env:
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
          REPO_ROOT: ${{ github.workspace }}
        run: bash "$REPO_ROOT/24/baseline-node24-full/build.sh"

  build-node24-puppeteer:
    name: baseline-node24-puppeteer
    needs: build-node24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: chiskat
          password: ${{ secrets.DOCKER_PASS }}

      - name: 构建并推送
        env:
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
          REPO_ROOT: ${{ github.workspace }}
        run: bash "$REPO_ROOT/24/baseline-node24-puppeteer/build.sh"

  build-node24-full-puppeteer:
    name: baseline-node24-full-puppeteer
    needs: build-node24-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: chiskat
          password: ${{ secrets.DOCKER_PASS }}

      - name: 构建并推送
        env:
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
          REPO_ROOT: ${{ github.workspace }}
        run: bash "$REPO_ROOT/24/baseline-node24-full-puppeteer/build.sh"
