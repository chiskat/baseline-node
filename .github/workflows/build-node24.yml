        with:
          node-version: 24
          cache: pnpm

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: chiskat
          password: ${{ secrets.DOCKER_PASS }}

      - name: 构建并推送
        env:
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
          REPO_ROOT: ${{ github.workspace }}
