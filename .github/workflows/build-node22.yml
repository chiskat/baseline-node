  build-node22-full-puppeteer:
    name: baseline-node22-full-puppeteer
    needs: build-node22-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
